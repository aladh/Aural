version: 2
updates:
  - package-ecosystem: cargo
    directory: /Backend/aural-playback
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
