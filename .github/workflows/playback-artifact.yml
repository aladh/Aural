name: Publish playback artifact

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-character reviewed source SHA covered by the candidate CI run
        required: true
        type: string
      candidate_run_id:
        description: Completed CI run with successful Rust and candidate Swift Debug/Release checks
        required: true
        type: string
      dry_run:
        description: Validate the candidate without publishing a release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: playback-artifact-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify tested playback candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      engine_digest: ${{ steps.candidate.outputs.engine_digest }}

    steps:
      - name: Check out trusted promotion policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify originating CI and candidate bytes
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python3 Scripts/playback_promotion.py \
            --run-id "$CANDIDATE_RUN_ID" \
            --source-ref "$SOURCE_REF" \
            --output "$RUNNER_TEMP/spotty-playback-publication"

      - name: Upload verified publication assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-publication-candidate
          path: ${{ runner.temp }}/spotty-playback-publication
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable playback release
    needs: [prepare]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified publication assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playback-publication-candidate
          path: ${{ runner.temp }}/spotty-playback-publication

      - name: Publish without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          ENGINE_INPUT_DIGEST: ${{ needs.prepare.outputs.engine_digest }}
          PLAYBACK_RELEASE_TAG: spotty-playback-core-${{ needs.prepare.outputs.engine_digest }}
          PUBLICATION_ROOT: ${{ runner.temp }}/spotty-playback-publication
        run: |
          set -euo pipefail
          if gh release view "$PLAYBACK_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing playback release $PLAYBACK_RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$PLAYBACK_RELEASE_TAG" \
            "$PUBLICATION_ROOT/SpottyPlaybackCore.xcframework.zip" \
            "$PUBLICATION_ROOT/SpottyPlaybackCore.xcframework.zip.sha256" \
            "$PUBLICATION_ROOT/source-provenance.txt" \
            "$PUBLICATION_ROOT/spotty_playback_provenance.json" \
            "$PUBLICATION_ROOT/SpottyPlaybackCore-notices.zip" \
            "$PUBLICATION_ROOT/LICENSE" \
            "$PUBLICATION_ROOT/NOTICE" \
            "$PUBLICATION_ROOT/THIRD_PARTY_NOTICES.md" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "SpottyPlaybackCore $SOURCE_SHA" \
            --notes "$(cat <<EOF
          > [!CAUTION]
          > Experimental, unofficial, independent Spotty playback artifact. Spotty is not affiliated with Spotify and uses unsupported reverse-engineered interfaces.

          Immutable macOS ARM64 SpottyPlaybackCore XCFramework built from source commit $SOURCE_SHA and engine input digest $ENGINE_INPUT_DIGEST. The archive includes its matching C headers, module map, source provenance, and required license notices. Update the reviewed artifact manifest with this release URL and SHA-256; published playback releases are never overwritten.
          EOF
          )"
