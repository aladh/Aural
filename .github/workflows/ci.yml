name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Debug quality gate
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust dependencies and build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            Backend/aural-playback/target
          key: macos-rust-${{ hashFiles('Backend/aural-playback/Cargo.lock') }}
          restore-keys: macos-rust-

      - name: Install verification tools
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install ripgrep

      - name: Show toolchains
        run: |
          swift --version
          rustc --version

      - name: Run checks
        run: ./Scripts/check.sh
