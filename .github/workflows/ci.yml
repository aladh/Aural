name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Debug quality gate
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Cache Rust dependencies and build products
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            Backend/aural-playback/target
          key: macos-rust-${{ hashFiles('Backend/aural-playback/Cargo.lock') }}
          restore-keys: macos-rust-

      - name: Install verification tools
        run: brew install ripgrep

      - name: Show toolchains
        run: |
          swift --version
          rustc --version

      - name: Run checks
        run: ./Scripts/check.sh
