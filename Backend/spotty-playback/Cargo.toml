[package]
name = "spotty-playback"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Private playback bridge used by the Spotty macOS application"

[lib]
name = "spotty_playback"
crate-type = ["staticlib"]

[dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "9c7d75615fc093bdcbdb29adbce3fed38c531852" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "9c7d75615fc093bdcbdb29adbce3fed38c531852" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "9c7d75615fc093bdcbdb29adbce3fed38c531852" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "9c7d75615fc093bdcbdb29adbce3fed38c531852" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
once_cell = "1.19"
serde_json = "1.0"
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "a1b66d3c8a14e55a9572a9e17467150dca618c9a" }
protobuf = "3"
serde = { version = "1.0", features = ["derive"] }
tokio-stream = "0.1"
futures-util = "0.3"
env_logger = "0.11"
log = "0.4"
# Only for the header map and method of the one connect-state request this crate builds
# itself; librespot's spclient takes them by these types.
http = "1"

[profile.release]
opt-level = 3
lto = true
